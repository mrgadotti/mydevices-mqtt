name: Build

on:
  push:
    branches: [main]
    # Release tags, with or without a leading "v" (v0.11.0, 0.11).
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the APK to (empty: build only, APK kept as a workflow artifact)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # The integration test talks to a public broker, so it stays out of CI.
      - run: npx jest --testPathIgnorePatterns integration

  apk:
    # Signed release APK: only for version tags and manual runs.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      - name: Check the toolchain used to build the local broker
        # `expo prebuild` runs native/build-broker.sh (Mosquitto for arm64-v8a): it needs the NDK, CMake and Ninja that
        # the runner image provides.
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          [ -f "$NDK/build/cmake/android.toolchain.cmake" ] || { echo "::error::Android NDK not found on the runner"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "NDK: $NDK"
          cmake --version | head -1
          command -v ninja > /dev/null || sudo apt-get install -y ninja-build > /dev/null
          ninja --version

      - run: npx expo prebuild --platform android --no-install

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          # Tolerate line breaks, spaces and quotes pasted around the value.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t"' > "$RUNNER_TEMP/keystore.b64"
          echo "KEYSTORE_BASE64 has $(wc -c < "$RUNNER_TEMP/keystore.b64") characters"
          if ! base64 -d "$RUNNER_TEMP/keystore.b64" > "$RUNNER_TEMP/release.jks"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. Recreate it from: base64 -w0 <keystore file>"
            exit 1
          fi
          echo "Decoded keystore: $(wc -c < "$RUNNER_TEMP/release.jks") bytes"

      - name: Build the release APK (arm64)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m" \
            -PMYDEVICE_STORE_FILE="$RUNNER_TEMP/release.jks" \
            -PMYDEVICE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PMYDEVICE_KEY_ALIAS="$KEY_ALIAS" \
            -PMYDEVICE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Name the APK and print its certificate
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "mydevice-mqtt-$VERSION.apk"
          echo "name=mydevice-mqtt-$VERSION.apk" >> "$GITHUB_OUTPUT"
          # Several build-tools versions are installed on the runner: use the newest one.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "mydevice-mqtt-$VERSION.apk" | grep "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          # The release may already exist (created in the GitHub UI): then only add or replace the APK.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "$TAG" --generate-notes
          fi
